const svg = d3.select("svg");
const margin = {top: 30, right: 20, bottom: 40, left: 50};
const width = +svg.attr("width") - margin.left - margin.right;
const height = +svg.attr("height") - margin.top - margin.bottom;

const g1 = svg.append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

const svgWidth = +svg.attr("width");

// ---- Gradient definition ----
const defs = svg.append("defs");

const gradient = defs.append("linearGradient")
  .attr("id", "so2-gradient")
  .attr("x1", "0%")
  .attr("y1", "100%")
  .attr("x2", "0%")
  .attr("y2", "0%");

const nStops = 30;

for (let i = 0; i < nStops; i++) {
  const t = i / (nStops - 1);
  gradient.append("stop")
    .attr("offset", `${t * 100}%`)
    .attr("stop-color", d3.interpolateRdBu(1 - t));
}

// ---- Colour bar group ----
const cbarWidth = 14;
const cbarHeight = height;

const cbarGroup = svg.append("g")
  .attr(
    "transform",
    `translate(${svgWidth - margin.right - 40}, ${margin.top})`
  );

// ---- Gradient rectangle ----
cbarGroup.append("rect")
  .attr("width", cbarWidth)
  .attr("height", cbarHeight)
  .style("fill", "url(#so2-gradient)");

// ---- Scale + axis ----
const so2Scale = d3.scaleLinear()
  .domain(d3.extent(so2s))
  .range([cbarHeight, 0]);

cbarGroup.append("g")
  .attr("transform", `translate(${cbarWidth}, 0)`)
  .call(d3.axisRight(so2Scale).ticks(5));

// ---- Colour bar label ----
cbarGroup.append("text")
  .attr("transform", "rotate(-90)")
  .attr("x", -cbarHeight / 2)
  .attr("y", cbarWidth + 32)
  .attr("text-anchor", "middle")
  .attr("font-size", 12)
  .text("SO₂");

g1.append("text")
  .attr("x", width / 2)
  .attr("y", height + 35)
  .attr("text-anchor", "middle")
  .attr("font-size", 12)
  .text("Wavelength [nm]");

g1.append("text")
  .attr("transform", "rotate(-90)")
  .attr("x", -height / 2)
  .attr("y", -40)
  .attr("text-anchor", "middle")
  .attr("font-size", 12)
  .text("Reflectance");


const xScale = d3.scaleLinear()
  .domain(d3.extent(wavelengths))
  .range([0, width-60]);

const yReflect = d3.scaleLinear().domain([0, 1]).range([height, 0]);
// const yAbsorb = d3.scaleLinear().domain([0, 1]).range([height, 0]);

[g1].forEach(g => {
  g.append("g")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(xScale));
});

g1.append("g").call(d3.axisLeft(yReflect));
// g2.append("g").call(d3.axisLeft(yAbsorb));

const color = d3.scaleSequential(d3.interpolateRdBu)
  .domain([d3.max(so2s), d3.min(so2s)]);

const lineReflect = d3.line()
  .x((d, i) => xScale(wavelengths[i]))
  .y(d => yReflect(d));

//const lineAbsorb = d3.line()
//  .x((d, i) => xScale(wavelengths[i]))
//  .y(d => yAbsorb(d));

const reflectPaths = g1.selectAll(".reflect")
  .data(absorbances)
  .enter()
  .append("path")
  .attr("fill", "none")
  .attr("stroke", (_, i) => color(so2s[i]))
  .attr("stroke-width", 2);

function update() {
  const a = +aSlider.value;
  const b = +bSlider.value;

  aVal.textContent = a.toFixed(1);
  bVal.textContent = b.toFixed(1);

  const reflectances = absorbances.map(abs =>
    abs.map(v => Math.exp(-v * a - b))
  );

  reflectPaths.attr("d", d => lineReflect(reflectances[absorbances.indexOf(d)]));
  absorbPaths.attr("d", d => lineAbsorb(d));
}

const aSlider = document.getElementById("aSlider");
const bSlider = document.getElementById("bSlider");
const aVal = document.getElementById("aVal");
const bVal = document.getElementById("bVal");

aSlider.addEventListener("input", update);
bSlider.addEventListener("input", update);

update();
</script>
